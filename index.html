<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Session Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#141310;
    --surface:#1e1b16;
    --surface-2:#252119;
    --iron:#3a342a;
    --iron-light:#4a4335;
    --chalk:#eee7d8;
    --dim:#8f8776;
    --rust:#c1502e;
    --rust-dim:#7a3420;
    --mat:#6b8f71;
    --mat-dim:#42553f;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at top left, rgba(193,80,46,0.06), transparent 55%),
      var(--bg);
    color:var(--chalk);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--rust); color:var(--chalk); }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--rust); outline-offset:2px;
  }

  #app{ max-width:920px; margin:0 auto; padding:20px 16px 60px; }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
    padding-bottom:16px; margin-bottom:18px;
    border-bottom:1px solid var(--iron);
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{
    font:600 11px/1 'IBM Plex Mono', monospace; letter-spacing:.18em;
    color:var(--rust); text-transform:uppercase;
  }
  .brand h1{
    font:600 30px/1 'Oswald', sans-serif; letter-spacing:.01em;
    margin:4px 0 0; text-transform:uppercase;
  }
  .streak{
    font:500 12px/1.4 'IBM Plex Mono', monospace; color:var(--dim);
    text-align:right;
  }
  .streak b{ color:var(--mat); font-size:20px; display:block; }

  .datenav{
    display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .datenav button.arrow{
    background:var(--surface); border:1px solid var(--iron); color:var(--chalk);
    width:34px; height:34px; border-radius:4px; font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .datenav button.arrow:hover{ border-color:var(--rust); color:var(--rust); }
  .datelabel{ flex:1; text-align:center; }
  .datelabel .day{ font:600 15px 'Oswald', sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .datelabel .date{ font:400 12px 'IBM Plex Mono', monospace; color:var(--dim); }
  .today-btn{
    background:transparent; border:1px solid var(--iron); color:var(--dim);
    font:500 11px 'IBM Plex Mono', monospace; padding:7px 10px; border-radius:4px;
    text-transform:uppercase; letter-spacing:.08em;
  }
  .today-btn:hover{ border-color:var(--mat); color:var(--mat); }

  /* ---------- Week rack (signature element) ---------- */
  .rack{
    background:var(--surface); border:1px solid var(--iron); border-radius:6px;
    padding:14px 16px 10px; margin-bottom:22px;
  }
  .rack-label{
    font:600 10px 'IBM Plex Mono', monospace; letter-spacing:.16em; color:var(--dim);
    text-transform:uppercase; margin-bottom:10px;
  }
  .rack-plates{ display:flex; gap:8px; align-items:flex-end; height:52px; }
  .plate-col{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; background:none; border:none; padding:0; color:inherit;
  }
  .plate-track{
    width:100%; max-width:34px; height:34px; border-radius:50%;
    border:2px solid var(--iron-light); position:relative; overflow:hidden;
    background:var(--surface-2);
  }
  .plate-track .fill{
    position:absolute; left:0; right:0; bottom:0; background:var(--rust-dim);
    transition:height .3s ease;
  }
  .plate-track.done{ border-color:var(--mat); }
  .plate-track.done .fill{ background:var(--mat-dim); }
  .plate-track.is-today{ border-color:var(--rust); box-shadow:0 0 0 3px rgba(193,80,46,0.15); }
  .plate-wk{ font:500 9px 'IBM Plex Mono', monospace; color:var(--dim); text-transform:uppercase; }
  .plate-col.is-today .plate-wk{ color:var(--rust); }

  /* ---------- Grid ---------- */
  .grid{ display:grid; grid-template-columns:1.15fr 1fr; gap:16px; }
  @media (max-width:680px){ .grid{ grid-template-columns:1fr; } }

  .card{
    background:var(--surface); border:1px solid var(--iron); border-radius:6px;
    padding:18px 18px 20px; display:flex; flex-direction:column;
  }
  .card-head{ margin-bottom:14px; }
  .card-tag{
    font:600 10px 'IBM Plex Mono', monospace; letter-spacing:.16em; color:var(--rust);
    text-transform:uppercase; margin-bottom:4px;
  }
  .card-title{ font:600 19px 'Oswald', sans-serif; text-transform:uppercase; letter-spacing:.01em; }
  .card-sub{ font:400 12px 'IBM Plex Sans', sans-serif; color:var(--dim); margin-top:2px; }

  /* Exercise rows */
  .ex-list{ display:flex; flex-direction:column; gap:2px; }
  .ex-row{
    display:flex; align-items:flex-start; gap:10px; padding:10px 6px;
    border-radius:4px; border-bottom:1px solid var(--iron);
  }
  .ex-row:last-child{ border-bottom:none; }
  .ex-row.checked{ opacity:.55; }
  .checkbox{
    width:18px; height:18px; border-radius:4px; border:2px solid var(--iron-light);
    background:var(--surface-2); flex:0 0 18px; margin-top:2px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .checkbox.on{ background:var(--mat); border-color:var(--mat); }
  .checkbox.on:after{ content:''; width:8px; height:5px; border-left:2px solid var(--bg);
    border-bottom:2px solid var(--bg); transform:rotate(-45deg) translateY(-1px); }
  .ex-body{ flex:1; }
  .ex-name-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .ex-name{ font:500 14px 'IBM Plex Sans', sans-serif; }
  .ex-row.checked .ex-name{ text-decoration:line-through; text-decoration-color:var(--dim); }
  .ex-sets{ font:500 12px 'IBM Plex Mono', monospace; color:var(--rust); white-space:nowrap; }
  .ex-note{ font:400 12px 'IBM Plex Sans', sans-serif; color:var(--dim); margin-top:2px; }

  /* Barbell protein gauge */
  .bar-wrap{ display:flex; flex-direction:column; align-items:center; margin:6px 0 18px; }
  .barbell{ display:flex; align-items:center; height:56px; }
  .sleeve{ width:120px; height:8px; background:var(--iron-light); border-radius:2px; position:relative; z-index:1; }
  .plate-stack{ display:flex; align-items:center; }
  .plate-stack.left{ flex-direction:row-reverse; }
  .bplate{ width:10px; border-radius:2px; background:var(--iron-light); margin:0 -1px; transition:.25s; }
  .bplate.loaded{ background:var(--rust); }
  .bcollar{ width:6px; height:20px; background:var(--iron); border-radius:1px; }
  .protein-readout{ margin-top:10px; text-align:center; }
  .protein-readout .num{ font:600 26px 'IBM Plex Mono', monospace; }
  .protein-readout .num span{ font-size:15px; color:var(--dim); font-weight:400; }
  .protein-readout .label{ font:500 10px 'IBM Plex Mono', monospace; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; margin-top:2px; }

  .meal-list{ display:flex; flex-direction:column; gap:2px; }
  .meal-row{ display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid var(--iron); }
  .meal-row:last-child{ border-bottom:none; }
  .meal-row.checked{ opacity:.55; }
  .meal-body{ flex:1; }
  .meal-time{ font:500 10px 'IBM Plex Mono', monospace; color:var(--rust); letter-spacing:.05em; }
  .meal-name{ font:500 13px 'IBM Plex Sans', sans-serif; margin-top:1px; }
  .meal-row.checked .meal-name{ text-decoration:line-through; text-decoration-color:var(--dim); }
  .meal-protein{ font:500 12px 'IBM Plex Mono', monospace; color:var(--dim); white-space:nowrap; }

  .footnote{
    margin-top:22px; font:400 11px 'IBM Plex Sans', sans-serif; color:var(--dim);
    text-align:center; line-height:1.6;
  }
  .footnote b{ color:var(--chalk); }

  .reset-link{
    background:none; border:none; color:var(--dim); font:400 11px 'IBM Plex Mono', monospace;
    text-decoration:underline; padding:0; margin-top:14px;
  }
  .reset-link:hover{ color:var(--rust); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const WORKOUTS = {
    0:{ label:"Weekend Rest", sub:"Active recovery", exercises:[
      {name:"Walk / light activity", note:"No lifting — let the nervous system recover"},
    ]},
    1:{ label:"Upper Body A — Width & Arms", sub:"Office day · 35–40 min cap", exercises:[
      {name:"Lat Pulldowns (Wide Grip)", sets:"3 × 8–10", note:"Pulls shoulders outward for back width"},
      {name:"Incline Dumbbell Press", sets:"3 × 8–10", note:"Fills out upper chest / collarbone area"},
      {name:"Dumbbell Lateral Raises", sets:"4 × 12–15", note:"Spam these — key for wide shoulders"},
      {name:"Tricep Rope Pushdowns", sets:"3 × 10–12", note:"Flares outer tricep head for arm thickness"},
      {name:"Dumbbell Hammer Curls", sets:"3 × 10–12", note:"Targets brachialis, widens arm from the front"},
    ]},
    2:{ label:"Lower Body & Cardio", sub:"Office day", exercises:[
      {name:"Leg Press", sets:"3 × 10"},
      {name:"Romanian Deadlifts / Leg Curls", sets:"3 × 10–12", note:"Tightens hamstrings & glutes"},
      {name:"Standing Calf Raises", sets:"3 × 15"},
      {name:"Treadmill Incline Walk", sets:"15 min", note:"12 incline / 4 speed — flushes bloat"},
    ]},
    3:{ label:"Full Rest", sub:"No gym today", exercises:[
      {name:"Walk 8,000 steps", note:"Naturally during office hours"},
    ]},
    4:{ label:"Upper Body B — Thickness & Shoulder Blast", sub:"WFH day", exercises:[
      {name:"Seated Cable Rows / T-Bar Rows", sets:"3 × 8–10", note:"Builds thick mid-back"},
      {name:"DB Overhead Shoulder Press", sets:"3 × 8–10", note:"Builds shoulder cap density"},
      {name:"Dumbbell Lateral Raises", sets:"4 × 12–15", note:"2nd width session this week"},
      {name:"Overhead Tricep Extension", sets:"3 × 10–12", note:"Hits long head for size"},
      {name:"Barbell / DB Bicep Curls", sets:"3 × 8–10", note:"Bicep peak builder"},
    ]},
    5:{ label:"Lower Body & Abs", sub:"WFH day", exercises:[
      {name:"Leg Extensions", sets:"3 × 12"},
      {name:"Lying / Seated Leg Curls", sets:"3 × 12"},
      {name:"Hanging Leg Raises / Cable Crunch", sets:"3 × 15"},
      {name:"Treadmill Incline Walk", sets:"15 min", note:"12 incline / 4 speed"},
    ]},
    6:{ label:"Weekend Rest", sub:"Active recovery", exercises:[
      {name:"Walk / light activity", note:"No lifting — let the nervous system recover"},
    ]},
  };

  const MEAL_SETS = {
    A:{ target:111, meals:[
      {time:"8:30 AM", name:"Oats (50g in milk) + 3 egg whites", protein:21},
      {time:"1:30 PM", name:"150g prepped chicken breast + rice/roti", protein:36},
      {time:"5:00 PM", name:"2 slices bread + 1 banana", protein:6},
      {time:"10:00 PM", name:"6-egg bhurji (2 whole + 4 white) + rice/chapati", protein:28},
    ]},
    B:{ target:113, meals:[
      {time:"8:30 AM", name:"Oats (50g in milk) + 3 egg whites", protein:21},
      {time:"1:30 PM", name:"6-egg bhurji + rice & dal", protein:28},
      {time:"5:00 PM", name:"2 slices bread + 1 banana", protein:6},
      {time:"8:30 PM", name:"200g pan-seared chicken breast + rice/salad", protein:46},
    ]},
    C:{ target:111, meals:[
      {time:"9:00 AM", name:"Oats (50g) + milk + 3 egg whites", protein:21},
      {time:"2:00 PM", name:"150g chicken breast + rice & dal", protein:38},
      {time:"5:30 PM", name:"2 slices bread + 1 banana", protein:6},
      {time:"8:30 PM", name:"6-egg bhurji + 2 chapatis", protein:28},
    ]},
  };
  const MEAL_SET_FOR_DAY = {0:'C',1:'A',2:'A',3:'A',4:'B',5:'B',6:'C'};

  const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const DAY_SHORT = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

  function fmtKey(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function sameDay(a,b){ return fmtKey(a)===fmtKey(b); }

  let viewDate = new Date();
  const todayKey = fmtKey(new Date());

  async function getState(key, fallbackLen){
    try{
      const r = await window.storage.get(key);
      const arr = JSON.parse(r.value);
      if(Array.isArray(arr) && arr.length===fallbackLen) return arr;
      return new Array(fallbackLen).fill(false);
    }catch(e){
      return new Array(fallbackLen).fill(false);
    }
  }
  async function setState(key, arr){
    try{ await window.storage.set(key, JSON.stringify(arr)); }catch(e){ console.error('storage set failed', e); }
  }

  // cache of {workout:[bool], meals:[bool]} per date key, loaded lazily
  const cache = {};

  async function loadDay(dateKey, dow){
    if(cache[dateKey]) return cache[dateKey];
    const exLen = WORKOUTS[dow].exercises.length;
    const mealSet = MEAL_SETS[MEAL_SET_FOR_DAY[dow]];
    const [workout, meals] = await Promise.all([
      getState('workout:'+dateKey, exLen),
      getState('meals:'+dateKey, mealSet.meals.length),
    ]);
    cache[dateKey] = { workout, meals };
    return cache[dateKey];
  }

  function dayCompletionRatio(dateKey, dow){
    const c = cache[dateKey];
    const mealSet = MEAL_SETS[MEAL_SET_FOR_DAY[dow]];
    if(!c) return { proteinPct:0, workoutDone:false };
    const proteinTotal = c.meals.reduce((s,on,i)=> s + (on ? mealSet.meals[i].protein : 0), 0);
    const proteinPct = Math.min(1, proteinTotal / mealSet.target);
    const workoutDone = c.workout.length>0 && c.workout.every(Boolean);
    return { proteinPct, workoutDone };
  }

  async function computeStreak(){
    let streak = 0;
    for(let i=0;i<60;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = fmtKey(d);
      const dow = d.getDay();
      await loadDay(key, dow);
      const { workoutDone } = dayCompletionRatio(key, dow);
      if(workoutDone) streak++;
      else if(i===0) continue; // allow today to be in-progress without breaking streak count start
      else break;
    }
    return streak;
  }

  const app = document.getElementById('app');

  async function render(){
    const dow = viewDate.getDay();
    const dateKey = fmtKey(viewDate);
    const isToday = dateKey===todayKey;
    const workout = WORKOUTS[dow];
    const mealSetKey = MEAL_SET_FOR_DAY[dow];
    const mealSet = MEAL_SETS[mealSetKey];

    await loadDay(dateKey, dow);
    const state = cache[dateKey];

    const proteinTotal = state.meals.reduce((s,on,i)=> s + (on ? mealSet.meals[i].protein : 0), 0);
    const proteinPct = Math.min(1, proteinTotal / mealSet.target);

    // week rack: Mon..Sun of the week containing viewDate
    const weekStart = new Date(viewDate);
    const diffToMon = (viewDate.getDay()+6)%7;
    weekStart.setDate(viewDate.getDate()-diffToMon);
    const weekDates = [...Array(7)].map((_,i)=>{ const d=new Date(weekStart); d.setDate(weekStart.getDate()+i); return d; });
    for(const d of weekDates){ await loadDay(fmtKey(d), d.getDay()); }

    const streak = await computeStreak();

    const NUM_PLATES = 4;
    function barbellHTML(pct){
      const loadedCount = Math.round(pct*NUM_PLATES);
      const sidePlates = Math.ceil(loadedCount/2);
      const sidePlatesR = loadedCount - sidePlates;
      const platesHTML=(n, cls)=>{
        let out='';
        for(let i=0;i<Math.ceil(NUM_PLATES/2);i++){
          const on = i<n;
          const h = 20+i*8;
          out += `<div class="bplate ${on?'loaded':''}" style="height:${h}px"></div>`;
        }
        return out;
      };
      return `
        <div class="barbell">
          <div class="bcollar"></div>
          <div class="plate-stack left">${platesHTML(sidePlates)}</div>
          <div class="sleeve"></div>
          <div class="plate-stack">${platesHTML(sidePlatesR)}</div>
          <div class="bcollar"></div>
        </div>`;
    }

    const rackHTML = weekDates.map(d=>{
      const key = fmtKey(d);
      const dw = d.getDay();
      const { proteinPct: p, workoutDone } = dayCompletionRatio(key, dw);
      const heightPct = Math.round(p*100);
      const isTodayCol = key===todayKey;
      const isSelected = key===dateKey;
      return `<button class="plate-col ${isTodayCol?'is-today':''}" data-date="${key}" title="${DAY_NAMES[dw]}">
        <div class="plate-track ${workoutDone?'done':''} ${isTodayCol?'is-today':''}" style="${isSelected?'box-shadow:0 0 0 2px var(--chalk) inset;':''}">
          <div class="fill" style="height:${heightPct}%"></div>
        </div>
        <div class="plate-wk">${DAY_SHORT[dw]}</div>
      </button>`;
    }).join('');

    const exRowsHTML = workout.exercises.map((ex,i)=>{
      const on = state.workout[i];
      return `<div class="ex-row ${on?'checked':''}">
        <button class="checkbox ${on?'on':''}" data-kind="workout" data-idx="${i}" aria-label="Mark ${ex.name} done"></button>
        <div class="ex-body">
          <div class="ex-name-row">
            <span class="ex-name">${ex.name}</span>
            ${ex.sets?`<span class="ex-sets">${ex.sets}</span>`:''}
          </div>
          ${ex.note?`<div class="ex-note">${ex.note}</div>`:''}
        </div>
      </div>`;
    }).join('');

    const mealRowsHTML = mealSet.meals.map((m,i)=>{
      const on = state.meals[i];
      return `<div class="meal-row ${on?'checked':''}">
        <button class="checkbox ${on?'on':''}" data-kind="meals" data-idx="${i}" aria-label="Mark ${m.name} eaten"></button>
        <div class="meal-body">
          <div class="meal-time">${m.time}</div>
          <div class="meal-name">${m.name}</div>
        </div>
        <div class="meal-protein">${m.protein}g</div>
      </div>`;
    }).join('');

    app.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <div class="eyebrow">Daily Session Log</div>
          <h1>Load &amp; Fuel</h1>
        </div>
        <div class="streak"><b>${streak}</b>day streak</div>
      </div>

      <div class="datenav">
        <button class="arrow" id="prevDay">‹</button>
        <div class="datelabel">
          <div class="day">${DAY_NAMES[dow]}${isToday?' · Today':''}</div>
          <div class="date">${viewDate.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</div>
        </div>
        <button class="arrow" id="nextDay">›</button>
        ${!isToday?'<button class="today-btn" id="jumpToday">Today</button>':''}
      </div>

      <div class="rack">
        <div class="rack-label">This week</div>
        <div class="rack-plates">${rackHTML}</div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="card-head">
            <div class="card-tag">Today's Lift</div>
            <div class="card-title">${workout.label}</div>
            <div class="card-sub">${workout.sub}</div>
          </div>
          <div class="ex-list">${exRowsHTML}</div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-tag">Fuel</div>
            <div class="card-title">Protein Load</div>
            <div class="card-sub">Zero whey · ${mealSetKey==='A'?'office days':mealSetKey==='B'?'WFH days':'weekend'}</div>
          </div>
          <div class="bar-wrap">
            ${barbellHTML(proteinPct)}
            <div class="protein-readout">
              <div class="num">${proteinTotal}<span> / ${mealSet.target}g</span></div>
              <div class="label">logged today</div>
            </div>
          </div>
          <div class="meal-list">${mealRowsHTML}</div>
        </div>
      </div>

      <div class="footnote">
        <b>Rules:</b> batch-prep chicken Sun &amp; Wed night · cap gym at 40 min · ate junk? lift heavy anyway, don't skip.
        <br/><button class="reset-link" id="resetDay">Clear today's checks</button>
      </div>
    `;

    // wire up events
    app.querySelector('#prevDay').onclick=()=>{ viewDate.setDate(viewDate.getDate()-1); render(); };
    app.querySelector('#nextDay').onclick=()=>{ viewDate.setDate(viewDate.getDate()+1); render(); };
    const jt = app.querySelector('#jumpToday'); if(jt) jt.onclick=()=>{ viewDate=new Date(); render(); };

    app.querySelectorAll('.plate-col').forEach(btn=>{
      btn.onclick=()=>{ viewDate = new Date(btn.dataset.date+'T00:00:00'); render(); };
    });

    app.querySelectorAll('.checkbox').forEach(btn=>{
      btn.onclick=async ()=>{
        const kind = btn.dataset.kind, idx = +btn.dataset.idx;
        state[kind][idx] = !state[kind][idx];
        await setState(kind+':'+dateKey, state[kind]);
        render();
      };
    });

    const resetBtn = app.querySelector('#resetDay');
    resetBtn.onclick=async ()=>{
      state.workout = state.workout.map(()=>false);
      state.meals = state.meals.map(()=>false);
      await Promise.all([
        setState('workout:'+dateKey, state.workout),
        setState('meals:'+dateKey, state.meals),
      ]);
      render();
    };
  }

  render();
})();
</script>
</body>
</html>
